[package]
name = "aoto-android"
version = "1.0.4"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Aoto's Android activity: a cdylib that GameActivity loads"

[lib]
name = "aoto_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
aoto = { path = "../.." }
eframe = { version = "0.37", default-features = false, features = ["android-game-activity"] }
# AndroidApp's type; the same winit eframe draws with (eframe doesn't re-export it).
winit = { version = "0.30", default-features = false }
android_logger = "0.15"
log = "0.4.34"
jni = "0.21"
