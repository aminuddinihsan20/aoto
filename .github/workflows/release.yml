name: Release

# Pushing a new version builds it and publishes it, with no button to press.
#
# On every push to main the `plan` job reads the version in Cargo.toml. If that version
# has no release yet (tag v<version>), it is released: the APK is built, attached, and the
# release is published at once with .github/release-notes/v<version>.md as its notes. A
# push that doesn't change the version builds nothing. Pushing a v* tag by hand, or
# running this workflow by hand, does the same for that tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decides whether this push is a release.
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.p.outputs.release }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; else tag="v$version"; fi
          release=true
          # A push to the branch that leaves the version alone is not a release.
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release tag=$tag"

  android:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to commits: this job handles the signing key.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # bindgen (rquickjs's Android bindings) needs libclang.
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          echo "LIBCLANG_PATH=$(llvm-config --libdir 2>/dev/null || dirname "$(find /usr/lib -name 'libclang*.so*' | head -1)")" >> "$GITHUB_ENV"

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "platforms;android-36" "build-tools;36.1.0"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Check versions match
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          apk_ver=$(grep -m1 'versionName' android/app/build.gradle.kts | cut -d'"' -f2)
          echo "Cargo.toml $cargo_ver, android $apk_ver"
          [ "$cargo_ver" = "$apk_ver" ] || { echo "version mismatch"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$cargo_ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$cargo_ver"; exit 1
          fi
          echo "VERSION=$cargo_ver" >> "$GITHUB_ENV"

      # Signed with the project's key, which the four secrets below hold. Without them the
      # build stops: a release signed with a throwaway debug key could never be updated
      # over by the next one.
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          else
            echo "::error::no signing key (the ANDROID_KEYSTORE secrets): not building a release that could not be updated"
            exit 1
          fi
          sh android/build.sh release

      # The key is on the runner's disk only while the APK is built.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/aoto-$VERSION-android-arm64.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: out/aoto-${{ env.VERSION }}-android-arm64.apk
          if-no-files-found: error

  attach:
    needs: [plan, android]
    # Nothing is published if the build failed.
    if: needs.plan.outputs.release == 'true' && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true

      # The release is published here, once every file is on it, with its notes: the app's
      # updater reads the latest published release, so it never sees one half built.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          ls -l files
          [ -n "$(ls -A files 2>/dev/null)" ] || { echo "nothing was built"; exit 1; }
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then notes_args="--notes-file $notes"; else notes_args="--generate-notes"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
            gh release edit "$TAG" --draft=false --latest --title "Aoto ${TAG#v}" $notes_args
          else
            # --target makes the tag at this commit when it doesn't exist yet.
            gh release create "$TAG" files/* --target "$GITHUB_SHA" --latest --title "Aoto ${TAG#v}" $notes_args
          fi
          gh release view "$TAG" --json url,isDraft --jq '"\(.url) draft=\(.isDraft)"'
