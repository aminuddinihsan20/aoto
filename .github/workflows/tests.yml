name: Tests

# Runs the tests and clippy when asked to: from the Actions tab ("Run workflow"), or with
# `gh workflow run tests.yml`. A push does not start it, and a release does not wait for it.
# The app is built for Android; its tests run on the host, and one host is enough.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev

      - name: Test
        run: cargo test --locked

      # What the Java side decides (widgets, audio focus, the car's lists), with a JDK alone.
      - uses: actions/setup-java@v5
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: "17"

      - name: Java checks
        if: ${{ !cancelled() }}
        run: JAVA_HOME="$JAVA_HOME" sh android/test-java.sh

      # Also when a test failed, so one run shows both.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
